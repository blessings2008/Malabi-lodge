services:
  - type: web
    name: malabi-exclusive-lodges
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: MALABI_NOTIFICATION_EMAIL
        value: malabiexclusivelodges@gmail.com
